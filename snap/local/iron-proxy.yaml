# iron-proxy configuration.
#
# This file is created, on first start, from the default template shipped in
# the snap. It lives in $SNAP_COMMON, so it survives snap refreshes. Edit it
# and then apply your changes:
#
#     sudo snap restart iron-proxy
#
# iron-proxy is default-deny: unless a request matches an allowlist rule it is
# rejected with 403. See https://docs.iron.sh for the full reference.

dns:
  # DNS interception is disabled by default. When enabled, iron-proxy answers
  # every name with `proxy_ip`, which must be the address clients use to reach
  # this host — the snap cannot guess it. To route workloads through the proxy
  # by DNS, set `enabled: true`, set `proxy_ip` to the host's address, and
  # point the workload's resolver at it.
  enabled: false
  listen: ":53"
  proxy_ip: ""
  # Domains to forward to the host resolver instead of intercepting:
  # passthrough:
  #   - "*.internal.example.com"

proxy:
  # Listeners for traffic routed to the proxy by DNS or by routing rules
  # (for example nftables/TPROXY).
  http_listen: ":80"
  https_listen: ":443"
  # Explicit HTTP/CONNECT/SOCKS5 proxy listener. Use it with the standard
  # HTTP_PROXY/HTTPS_PROXY/ALL_PROXY environment variables, or on its own
  # while DNS interception is disabled.
  tunnel_listen: ":8080"

tls:
  # "mitm" intercepts TLS with the CA below; "sni-only" passes TLS through and
  # can only match on the hostname. The CA is generated by the snap on first
  # start and lives beside this file.
  mode: mitm
  ca_cert: "@SNAP_COMMON@/ca.crt"
  ca_key: "@SNAP_COMMON@/ca.key"

# Transforms run in order on every request. The allowlist transform is what
# makes the proxy default-deny; without allowlist rules, every request is
# rejected.
transforms:
  - name: allowlist
    config:
      # Add the domains and CIDRs your workloads are allowed to reach.
      domains: []
      cidrs: []
      # Set `warn: true` to log what would be blocked without enforcing it,
      # which is useful while building out the allowlist.
      # warn: true
      # Example:
      # domains:
      #   - "api.openai.com"
      #   - "*.anthropic.com"
      # cidrs:
      #   - "10.0.0.0/8"

log:
  level: "info"
